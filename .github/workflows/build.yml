name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GAV_REQUIRE_ENGINE: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install GavCore (pinned release, sha256 verified)
        run: python install_gavcore.py
      - name: Test
        run: |
          pip install pytest flake8 -r requirements.txt
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install GavCore (pinned release, sha256 verified)
        run: python install_gavcore.py
      - name: Test
        run: |
          pip install pytest -r requirements.txt
          pytest -v
      - uses: microsoft/setup-msbuild@v2
      - name: Build WinUI app (with gavcore.exe bundled)
        run: msbuild winui/GavWinUI/GavWinUI.csproj /restore /m /p:Configuration=Release /p:Platform=x64 "/p:GavCoreExe=$env:LOCALAPPDATA\Programs\GavCore\gavcore.exe"
      - name: Upload WinUI app
        uses: actions/upload-artifact@v4
        with:
          name: GAV-WinUI-x64
          path: winui/GavWinUI/bin/x64/Release/
